worker_processes 1;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream corpus_api {
        # Round-robin across the two API instances. Both share one volume,
        # so uploads, downloads and withdrawals work regardless of routing.
        server api1:8000 max_fails=3 fail_timeout=5s;
        server api2:8000 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 80;
        client_max_body_size 10m;

        location / {
            proxy_pass http://corpus_api;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
