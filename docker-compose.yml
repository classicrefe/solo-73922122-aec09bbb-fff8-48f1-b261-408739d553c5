services:
  api1:
    build: .
    environment:
      CORPUS_DATA_DIR: /data
      JOB_STALE_SECONDS: "30"
    volumes:
      - corpus-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s

  api2:
    build: .
    environment:
      CORPUS_DATA_DIR: /data
      JOB_STALE_SECONDS: "30"
    volumes:
      - corpus-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    restart: unless-stopped

volumes:
  corpus-data:
